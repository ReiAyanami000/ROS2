stm32_bridge:
  ros__parameters:
    serial_port: /dev/ttyUSB0
    baudrate: 115200
    heartbeat_period: 0.1
    status_timeout: 0.6
    odom_timeout: 0.3
    ack_timeout: 0.25
    max_retries: 2
    query_period: 0.4
    stop_timeout: 4.0
    odom_frame: odom
    base_frame: base_link
    publish_tf: true
    max_distance: 5.0
    max_speed: 0.20
    max_acceleration: 0.20
    max_angular_speed: 1.5707964
    max_angular_acceleration: 1.3962634
    max_timeout_ms: 120000
    # Initial estimates, not calibrated sensor accuracy. Replace after calibration.
    pose_variance: [0.01, 0.01, 1000.0, 1000.0, 1000.0, 0.02]
    twist_variance: [0.01, 1000.0, 1000.0, 1000.0, 1000.0, 0.02]

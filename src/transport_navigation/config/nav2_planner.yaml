# 只用于已有静态地图上的规划，不启动底盘控制器。
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: transport_orthogonal_planner::OrthogonalPlanner
      turn_penalty: 0.10
      cost_weight: 2.0
      max_planning_time: 3.0
      max_expansions: 1000000
      max_states: 2000000

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      rolling_window: false
      update_frequency: 5.0
      publish_frequency: 2.0
      resolution: 0.01
      track_unknown_space: true
      transform_tolerance: 0.3
      always_send_full_costmap: true
      # 启动文件会用必填的 robot_radius 参数覆盖此占位值。
      robot_radius: 0.15
      footprint_padding: 0.0
      plugins: [static_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /navigation/mission_map
        map_subscribe_transient_local: true
        subscribe_to_updates: false
        footprint_clearing_enabled: false
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        # 启动时设为 robot_radius + 额外的代价衰减距离。
        inflation_radius: 0.30
        cost_scaling_factor: 5.0
